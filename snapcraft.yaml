name: zordeer-runtime
base: core26
adopt-info: runtime-packages
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
summary: A Zordeer runtime
description: |
 A package containing some items necessary for the Zordeer to function.
grade: stable
confinement: strict
compression: lzo

slots:
  zordeer-runtime:
    interface: content
    read:
      - /

parts:
  runtime-packages:
    plugin: nil
    stage-packages:
      - libgstreamer1.0-0
      - libgstreamer-gl1.0-0
      - gstreamer1.0-plugins-base
      - libgstreamer-plugins-base1.0-0
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - libgstreamer-plugins-bad1.0-0
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-libav
      - gstreamer1.0-vaapi
      - gstreamer1.0-alsa
      - gstreamer1.0-gl
      - gstreamer1.0-x
      - gstreamer1.0-plugins-rtp
      - gstreamer1.0-tools
      - libsdl2-classic
      - libsdl3-0
    override-build: |
      craftctl default
      craftctl set version=$(date +%Y-%m-%d)

  kf6-cleanup:
    after: [runtime-packages]
    plugin: nil
    source: https://github.com/canonical/gpu-snap.git
    build-snaps:
    - kf6-core26
    - gtk-common-themes
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2604-cleanup mesa-2604
      set -eux
      for snap in "kf6-core26" "gtk-common-themes"; do
          cd "/snap/$snap/current" && find . -type f,l \( -name "*.so.*" -o -name "*.so" \) -exec rm -f "$CRAFT_PRIME/{}" \;
      done

  mangohud:
    after: [runtime-packages]
    plugin: dump
    source: https://github.com/flightlessmango/MangoHud/releases/download/v0.8.4/MangoHud-0.8.4.r0.g992103e.tar.gz
    override-build: |
      craftctl default
      tar -xvf MangoHud-package.tar -C $CRAFT_PART_INSTALL
      sed -i 's|MANGOHUD_LIB_NAME="/usr/lib/mangohud/\\$LIB/libMangoHud_shim.so"|MANGOHUD_LIB_NAME="/usr/lib/mangohud/lib64/libMangoHud_shim.so"|' $CRAFT_PART_INSTALL/usr/bin/mangohud
    prime:
      - usr/bin
      - usr/lib/mangohud/lib64
      - usr/share
